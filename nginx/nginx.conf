# Configuración Nginx para Bar El Éxtasis
# ==========================================
# Instrucciones de instalación en Windows:
# 1. Instalar Nginx desde https://nginx.org/en/download.html
# 2. Copiar este archivo a /nginx/conf/nginx.conf
# 3. Ejecutar: nginx -s reload
#
# Arquitectura:
#   - Nginx sirve frontend estático y API desde Django
#   - Django/Waitress maneja /api/ y /admin/
#   - React build estático en /frontend/dist/

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type    application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;
    error_log  logs/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Frontend estático (React build)
        root C:/Users/Admin/Desktop/Extasis/frontend/dist;
        index index.html;

        # React SPA - fallback to index.html
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # API Django
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin
        location /admin/ {
            proxy_pass http://127.0.0.1:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Media files
        location /media/ {
            proxy_pass http://127.0.0.1:8000/media/;
        }

        # Static files (Django)
        location /static/ {
            alias C:/Users/Admin/Desktop/Extasis/frontend/dist/assets/;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}